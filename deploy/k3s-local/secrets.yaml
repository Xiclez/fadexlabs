# Secretos SOLO para el clúster local de pruebas (valores de juguete; nunca los uses en producción).
# El de slskd (cuenta de Soulseek) se crea a mano: ver README.
apiVersion: v1
kind: Secret
metadata: {name: fadex-postgres, namespace: fadexlabs}
type: Opaque
stringData:
  POSTGRES_USER: fadex
  POSTGRES_DB: fadex
  POSTGRES_PASSWORD: fadex-local
---
apiVersion: v1
kind: Secret
metadata: {name: fadex-api, namespace: fadexlabs}
type: Opaque
stringData:
  FADEX_DATABASE_URL: postgresql+asyncpg://fadex:fadex-local@postgres:5432/fadex
---
# Sin token de ACRCloud, Tracklist ID usa solo Shazam. Para poner el tuyo, ver README.
# La API key de slskd debe ser la misma que pongas en deploy/slskd/slskd.yml.
apiVersion: v1
kind: Secret
metadata: {name: fadex-worker, namespace: fadexlabs}
type: Opaque
stringData:
  ACRCLOUD_TOKEN: ""
  FADEX_SLSKD_API_KEY: fadex-local-key
