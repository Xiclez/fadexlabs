# EJEMPLO: no apliques este archivo con valores reales en git.
# Crea los Secrets directamente en el servidor, por ejemplo:
#
#   kubectl -n fadexlabs create secret generic fadex-postgres \
#     --from-literal=POSTGRES_USER=fadex --from-literal=POSTGRES_DB=fadex \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)"
#
#   python apps/api/scripts/gen_jwt_keys.py   # copia la PRIVATE KEY
#   kubectl -n fadexlabs create secret generic fadex-api \
#     --from-literal=FADEX_DATABASE_URL="postgresql+asyncpg://fadex:<password>@postgres:5432/fadex" \
#     --from-file=FADEX_JWT_PRIVATE_KEY=jwt_private.pem \
#     --from-literal=FADEX_SMTP_HOST=... --from-literal=FADEX_SMTP_USER=... --from-literal=FADEX_SMTP_PASSWORD=...
#
#   kubectl -n fadexlabs create secret generic fadex-cloudflared --from-literal=TUNNEL_TOKEN=...
#
# Worker de las herramientas. ACRCLOUD_TOKEN es el token personal de la consola de ACRCloud (el mismo
# de djset/.env; sin él, Tracklist ID usa solo Shazam). rclone.conf es el del servidor que ya sube a
# Drive (rclone config file te dice dónde está); el remoto debe coincidir con FADEX_RCLONE_REMOTE.
#
#   SLSKD_KEY="$(openssl rand -hex 24)"
#   kubectl -n fadexlabs create secret generic fadex-worker \
#     --from-literal=ACRCLOUD_TOKEN=... \
#     --from-literal=FADEX_SLSKD_API_KEY="$SLSKD_KEY" \
#     --from-file=rclone.conf="$HOME/.config/rclone/rclone.conf"
#
# slskd: copia deploy/slskd/slskd.example.yml a slskd.yml, pon la cuenta de Soulseek (una solo para
# esto) y la misma API key ($SLSKD_KEY) y créalo como Secret:
#
#   kubectl -n fadexlabs create secret generic fadex-slskd --from-file=slskd.yml=deploy/slskd/slskd.yml
apiVersion: v1
kind: Secret
metadata: {name: fadex-api, namespace: fadexlabs}
type: Opaque
stringData:
  FADEX_DATABASE_URL: postgresql+asyncpg://fadex:CAMBIAR@postgres:5432/fadex
  FADEX_JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    CAMBIAR
    -----END PRIVATE KEY-----
  FADEX_SMTP_HOST: ""
  FADEX_SMTP_USER: ""
  FADEX_SMTP_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata: {name: fadex-worker, namespace: fadexlabs}
type: Opaque
stringData:
  ACRCLOUD_TOKEN: ""
  FADEX_SLSKD_API_KEY: CAMBIAR
  rclone.conf: |
    [gdrive]
    type = drive
    CAMBIAR
